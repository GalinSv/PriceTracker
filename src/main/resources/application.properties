spring.application.name=price-tracker
server.port=8081

# PostgreSQL from docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/price_tracker
spring.datasource.username=price_tracker
spring.datasource.password=price_tracker

# Code first: Hibernate creates and updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
