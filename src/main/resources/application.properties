spring.application.name=price-tracker
server.port=8081

# PostgreSQL from docker-compose.yml
# reWriteBatchedInserts: much faster bulk inserts (the store catalogs have hundreds of thousands of links)
spring.datasource.url=jdbc:postgresql://localhost:5432/price_tracker?reWriteBatchedInserts=true
spring.datasource.username=price_tracker
spring.datasource.password=price_tracker

# Code first: Hibernate creates and updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# The price refresh and the catalog update must not wait for each other
spring.task.scheduling.pool.size=2

app.scraper.user-agent=Mozilla/5.0 (compatible; PriceTrackerBot/0.1)
app.scraper.timeout-ms=20000
# Every 6 hours: 00:00, 06:00, 12:00, 18:00
app.scraper.refresh-cron=0 0 */6 * * *

# Store catalogs (product links from the sitemaps) are checked every hour and downloaded again if older than a day
app.catalog.initial-delay-ms=30000
app.catalog.check-interval-ms=3600000
