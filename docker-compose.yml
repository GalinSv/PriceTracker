services:
  # The backend connects on localhost:5432 (see application.properties).
  # Desktop pgAdmin: host localhost, port 5432, username and password price_tracker.
  postgres:
    image: postgres:17.11-alpine
    container_name: price-tracker-postgres
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: price_tracker
      POSTGRES_PASSWORD: price_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  # Logins: http://localhost:8180. The realm "price-tracker" is created from keycloak/price-tracker-realm.json
  # on the first start (with a test admin and a test user); the admin console uses the bootstrap admin below.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: price-tracker-keycloak
    command: start-dev --import-realm --http-port=8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: console-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: YFlpnemiEVB1QMw3
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: price_tracker
      KC_DB_PASSWORD: price_tracker
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
