services:
  # The backend connects on localhost:5432 (see application.properties).
  # Desktop pgAdmin: host localhost, port 5432, username and password price_tracker.
  postgres:
    image: postgres:17.11-alpine
    container_name: price-tracker-postgres
    environment:
      POSTGRES_DB: price_tracker
      POSTGRES_USER: price_tracker
      POSTGRES_PASSWORD: price_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
